<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herói da semana</title>
  <style>
    :root {
      --navy: #0f2742;
      --orange: #f97316;
      --orange-soft: #fff3e8;
      --muted: #64748b;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .page { max-width: 900px; width: 100%; text-align: center; }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--orange-soft);
      color: var(--orange);
      border: 1px solid rgba(249,115,22,0.22);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    h1 {
      font-size: clamp(28px, 5vw, 52px);
      letter-spacing: -0.04em;
      margin-bottom: 8px;
      color: var(--navy);
    }
    .subtitle { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 1.5rem; }

    .today-row {
      display: flex;
      justify-content: center;
      margin-bottom: 1.25rem;
      min-height: 36px;
      align-items: center;
    }
    .today-btn {
      padding: 7px 20px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      transition: all 0.15s;
      letter-spacing: 0.03em;
    }
    .today-btn:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-soft); }
    .today-btn.hidden { opacity: 0; pointer-events: none; }

    .stage {
      overflow: hidden;
      position: relative;
      width: 100%;
      cursor: grab;
      user-select: none;
    }
    .stage.dragging { cursor: grabbing; }

    .track {
      display: flex;
      gap: 20px;
      will-change: transform;
      padding: 12px 4px 20px;
    }

    .card-wrap { flex: 0 0 var(--card-w); min-width: 0; }

    .card {
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 24px 16px;
      background: white;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .card-wrap.is-center .card {
      border-color: var(--orange);
      border-width: 2px;
      box-shadow: 0 8px 32px rgba(249,115,22,0.13);
    }
